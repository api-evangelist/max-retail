name: Max Retail
description: >-
  Max Retail is a Techstars-backed platform that helps brick-and-mortar
  boutiques and multi-location retailers turn unsold and aged inventory into
  cash. Retailers connect their point-of-sale or e-commerce system — Shopify,
  RICS, or Square — or upload a CSV, and Max Retail lists, markets, and sells the
  items to a network of shoppers across multiple channels, handles customer
  service, and pays out through Stripe when a prepaid shipping label is scanned.
  The retailer only ships; Max Retail charges a flat 15% fee plus shipping. Max
  Retail integrates inbound with third-party commerce platforms and payment
  processors but does not publish a public developer API, SDKs, or a webhook
  surface of its own.
